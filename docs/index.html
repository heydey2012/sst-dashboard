<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SST · Signal Sentinels Team</title>
<style>
  :root{
    --bg: #f6f7f9; --panel: #ffffff; --line: #e5e8ee;
    --text: #12161f; --muted: #6b7787; --muted-2: #9aa3b2;
    --green: #0aa279; --green-dim: rgba(10,162,121,0.09);
    --amber: #b7791f; --amber-dim: rgba(183,121,31,0.10);
    --red: #d64545;
    --sans: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
    --mono: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:var(--sans); background:var(--bg); color:var(--text);
    padding-bottom:60px;
  }
  .wrap{ max-width:760px; margin:0 auto; padding:24px 16px 0; }
  h1{ font-size:22px; margin:0 0 4px; }
  .sub{ color:var(--muted); font-size:13px; margin-bottom:20px; }

  .tabs{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .tab{
    padding:8px 16px; border-radius:999px; border:1px solid var(--line);
    background:var(--panel); font-size:13.5px; font-weight:600; cursor:pointer; color:var(--muted);
  }
  .tab.active{ background:var(--text); color:#fff; border-color:var(--text); }

  .meta{ font-size:12.5px; color:var(--muted); margin-bottom:16px; font-family:var(--mono); }

  .section-label{ font-size:13px; font-weight:700; margin:18px 2px 10px; color:var(--muted); }

  .card{
    border:1px solid var(--line); background:var(--panel); border-radius:12px;
    padding:16px; margin-bottom:10px;
  }
  .card-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .card-name{ font-size:15.5px; font-weight:700; }
  .badge{
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px;
    background:var(--green-dim); color:var(--green);
  }
  .card-line{ font-size:13px; color:var(--muted); margin-top:8px; line-height:1.6; }
  .card-star{ font-size:12.5px; color:var(--amber); margin-top:6px; }

  .empty{ text-align:center; padding:50px 20px; color:var(--muted); font-size:13px; }
  .loading{ text-align:center; padding:50px 20px; color:var(--muted); font-size:13px; }

  .portfolio{
    border:1px solid var(--line); background:var(--panel); border-radius:14px;
    padding:16px 18px; margin-bottom:20px;
  }
  .portfolio-title{ font-size:13px; font-weight:700; color:var(--muted); margin-bottom:12px; }
  .portfolio-stats{ display:flex; gap:22px; flex-wrap:wrap; margin-bottom:4px; }
  .stat-label{ font-size:11.5px; color:var(--muted-2); margin-bottom:2px; }
  .stat-value{ font-size:17px; font-weight:700; font-family:var(--mono); }
  .stat-value.pos{ color:var(--green); }
  .stat-value.neg{ color:var(--red); }

  .pos-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:10px 0; border-top:1px solid var(--line);
  }
  .pos-info{ min-width:0; }
  .pos-name{ font-size:14px; font-weight:700; }
  .pos-line{ font-size:12px; color:var(--muted); margin-top:3px; font-family:var(--mono); }
  .pos-pnl{ text-align:right; white-space:nowrap; }
  .pos-pnl-amt{ font-size:14px; font-weight:700; font-family:var(--mono); }
  .pos-pnl-pct{ font-size:11.5px; font-family:var(--mono); }
  .liquidate-btn{
    display:inline-block; margin-top:6px; padding:4px 10px; border-radius:999px;
    font-size:11px; font-weight:700; text-decoration:none;
    background:var(--red); color:#fff; opacity:0.85;
  }
  .liquidate-btn:hover{ opacity:1; }
  .no-positions{ font-size:12.5px; color:var(--muted-2); padding:8px 0 2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📋 SST · Signal Sentinels Team</h1>
  <div class="sub">RSI Spread Pro 기반 반등 시그널 자동 스캔 결과</div>

  <div class="portfolio" id="portfolio"></div>

  <div class="tabs" id="tabs"></div>
  <div class="meta" id="meta"></div>
  <div id="content" class="loading">불러오는 중...</div>
</div>

<script>
const TIMEFRAMES = [
  { key: "4h", label: "4시간봉" },
  { key: "1h", label: "1시간봉" },
  { key: "15m", label: "15분봉" },
  { key: "5m", label: "5분봉" },
];

const REPO = "heydey2012/sst-dashboard";
let current = "4h";
const cache = {};

async function loadPositions() {
  try {
    const res = await fetch(`results/positions.json?t=${Date.now()}`);
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;
  }
}

function liquidateUrl(ticker, name) {
  const title = encodeURIComponent(`청산:${ticker}`);
  const body = encodeURIComponent(`대시보드에서 요청한 강제 매도입니다.\n종목: [${ticker}] ${name}\n\n이 이슈를 그대로 "Submit new issue"로 등록하면, 다음 자동 점검 주기(최대 3분 이내)에 시장가로 매도됩니다.`);
  return `https://github.com/${REPO}/issues/new?title=${title}&body=${body}`;
}

function renderPortfolio(data) {
  const el = document.getElementById("portfolio");
  if (!data) {
    el.innerHTML = `<div class="portfolio-title">🧪 모의투자 현황</div><div class="no-positions">아직 데이터가 없습니다 (자동매매가 최소 한 번 점검을 마쳐야 표시됩니다).</div>`;
    return;
  }

  const hasCapital = data.current_capital !== null && data.current_capital !== undefined;
  const profitClass = (data.profit_amount || 0) >= 0 ? "pos" : "neg";
  const sign = (data.profit_amount || 0) >= 0 ? "+" : "";

  let html = `<div class="portfolio-title">🧪 모의투자 현황 (키움 모의계좌) · ${formatDateTime(data.last_updated)}</div>`;
  html += `<div class="portfolio-stats">`;
  html += `<div><div class="stat-label">초기 자금</div><div class="stat-value">₩${data.initial_capital.toLocaleString()}</div></div>`;
  html += `<div><div class="stat-label">현재 자금</div><div class="stat-value">${hasCapital ? "₩" + data.current_capital.toLocaleString() : "조회 실패"}</div></div>`;
  if (hasCapital) {
    html += `<div><div class="stat-label">수익률</div><div class="stat-value ${profitClass}">${sign}${data.return_pct}%</div></div>`;
    html += `<div><div class="stat-label">수익금</div><div class="stat-value ${profitClass}">${sign}₩${data.profit_amount.toLocaleString()}</div></div>`;
  }
  html += `</div>`;

  const positions = data.positions || [];
  if (positions.length === 0) {
    html += `<div class="no-positions">현재 보유 중인 포지션이 없습니다.</div>`;
  } else {
    positions.forEach(p => {
      const hasPrice = p.current_price !== null && p.current_price !== undefined;
      const pnlClass = (p.pnl || 0) >= 0 ? "pos" : "neg";
      const pnlSign = (p.pnl || 0) >= 0 ? "+" : "";
      html += `
        <div class="pos-row">
          <div class="pos-info">
            <div class="pos-name">[${escapeHtml(p.ticker)}] ${escapeHtml(p.name)}</div>
            <div class="pos-line">${p.qty}주 · 매수 ${p.entry_price.toLocaleString()} → 현재 ${hasPrice ? p.current_price.toLocaleString() : "-"}</div>
            <a class="liquidate-btn" href="${liquidateUrl(p.ticker, p.name)}" target="_blank" rel="noopener">청산</a>
          </div>
          <div class="pos-pnl">
            <div class="pos-pnl-amt ${hasPrice ? pnlClass : ''}">${hasPrice ? pnlSign + '₩' + p.pnl.toLocaleString() : '-'}</div>
            <div class="pos-pnl-pct ${hasPrice ? pnlClass : ''}">${hasPrice ? pnlSign + p.pnl_pct + '%' : ''}</div>
          </div>
        </div>
      `;
    });
  }

  el.innerHTML = html;
}

async function loadResult(tf) {
  if (cache[tf]) return cache[tf];
  try {
    const res = await fetch(`results/${tf}.json?t=${Date.now()}`);
    if (!res.ok) return null;
    const data = await res.json();
    cache[tf] = data;
    return data;
  } catch (e) {
    return null;
  }
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  TIMEFRAMES.forEach(tf => {
    const el = document.createElement("div");
    el.className = "tab" + (tf.key === current ? " active" : "");
    el.textContent = tf.label;
    el.onclick = () => { current = tf.key; render(); };
    tabs.appendChild(el);
  });
}

function formatDateTime(isoString) {
  const d = new Date(isoString);
  if (isNaN(d.getTime())) return isoString;
  const days = ["일요일","월요일","화요일","수요일","목요일","금요일","토요일"];
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  const dayName = days[d.getDay()];
  let hours = d.getHours();
  const ampm = hours >= 12 ? "PM" : "AM";
  hours = hours % 12;
  if (hours === 0) hours = 12;
  const hh = String(hours).padStart(2, "0");
  const min = String(d.getMinutes()).padStart(2, "0");
  const sec = String(d.getSeconds()).padStart(2, "0");
  return `${yyyy}-${mm}-${dd} ${dayName} ${ampm} ${hh}:${min}:${sec}`;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

function renderCard(v) {
  const reasons = (v.reasons || []).join(", ");
  const entryNote = v.has_active_entry ? " (진입 조건 활성)" : "";
  const bestTag = v.best_signal ? `<span class="badge">강추</span>` : "";
  return `
    <div class="card">
      <div class="card-top">
        <div class="card-name">[${escapeHtml(v.ticker)}] ${escapeHtml(v.name)}${entryNote}</div>
        ${bestTag}
      </div>
      <div class="card-line">시그널 ${escapeHtml(v.signal_time)} @ ${v.signal_price.toLocaleString()}</div>
      <div class="card-line">반등봉 ${escapeHtml(v.rebound_time)} (${v.bars_after_signal}봉 후) @ ${v.rebound_price.toLocaleString()}</div>
      <div class="card-line">패턴: ${escapeHtml(reasons)}</div>
      ${v.best_signal ? `<div class="card-star">⭐ ${escapeHtml(v.best_reason)}</div>` : ""}
    </div>
  `;
}

async function render() {
  renderTabs();
  const content = document.getElementById("content");
  const meta = document.getElementById("meta");
  content.innerHTML = `<div class="loading">불러오는 중...</div>`;
  meta.textContent = "";

  const data = await loadResult(current);
  if (!data) {
    content.innerHTML = `<div class="empty">아직 이 타임프레임의 결과가 없습니다.<br>스캔이 최소 한 번 실행되어야 표시됩니다.</div>`;
    return;
  }

  meta.textContent = `마지막 업데이트: ${formatDateTime(data.last_updated)} · 전체 ${data.total_tickers}종목 · 시그널 ${data.total_signals}건`;

  const results = data.results || [];
  if (results.length === 0) {
    content.innerHTML = `<div class="empty">현재 조건에 맞는 반등 패턴이 없습니다.</div>`;
    return;
  }

  const fresh = results.filter(r => r.is_fresh).sort((a, b) => (b.best_signal ? 1 : 0) - (a.best_signal ? 1 : 0));
  const stale = results.filter(r => !r.is_fresh).sort((a, b) => (b.best_signal ? 1 : 0) - (a.best_signal ? 1 : 0));

  let html = "";
  if (fresh.length > 0) {
    html += `<div class="section-label">🆕 방금 확인됨 (${fresh.length}건)</div>`;
    html += fresh.map(renderCard).join("");
  }
  if (stale.length > 0) {
    html += `<div class="section-label">📚 최근 히스토리 · 참고용 (${stale.length}건)</div>`;
    html += stale.map(renderCard).join("");
  }
  content.innerHTML = html;
}

async function refreshPortfolio() {
  renderPortfolio(await loadPositions());
}

render();
refreshPortfolio();
setInterval(() => { cache[current] = null; render(); }, 60000); // 1분마다 자동 새로고침
setInterval(refreshPortfolio, 60000);
</script>
</body>
</html>
