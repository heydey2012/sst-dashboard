<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SST · Signal Sentinels Team</title>
<style>
  :root{
    --bg: #f6f7f9; --panel: #ffffff; --line: #e5e8ee;
    --text: #12161f; --muted: #6b7787; --muted-2: #9aa3b2;
    --green: #0aa279; --green-dim: rgba(10,162,121,0.09);
    --amber: #b7791f; --amber-dim: rgba(183,121,31,0.10);
    --red: #d64545;
    --sans: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
    --mono: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:var(--sans); background:var(--bg); color:var(--text);
    padding-bottom:60px;
  }
  .wrap{ max-width:760px; margin:0 auto; padding:24px 16px 0; }
  .header-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  h1{ font-size:22px; margin:0 0 4px; }
  .sub{ color:var(--muted); font-size:13px; margin-bottom:20px; }

  .header-btns{ display:flex; gap:8px; flex-shrink:0; margin-top:2px; }
  .refresh-btn{
    flex-shrink:0; padding:8px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--panel); color:var(--text); font-size:13px; font-weight:600;
    cursor:pointer; white-space:nowrap;
  }
  .refresh-btn:active{ transform:scale(0.96); }
  .refresh-btn.spinning{ opacity:0.6; }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(18,22,31,0.45); z-index:100;
    display:flex; align-items:flex-start; justify-content:center; padding:24px 16px;
    overflow-y:auto;
  }
  .modal{
    background:var(--panel); border-radius:14px; max-width:720px; width:100%;
    padding:20px; margin-top:20px;
  }
  .modal-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .modal-title{ font-size:16px; font-weight:700; }
  .modal-close{
    border:none; background:none; font-size:20px; cursor:pointer; color:var(--muted);
    line-height:1; padding:4px;
  }
  .report-controls{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .report-search{
    flex:1; min-width:160px; padding:8px 12px; border-radius:8px; border:1px solid var(--line);
    font-size:13px; font-family:var(--sans); background:var(--bg); color:var(--text);
  }
  .report-group-btn{
    padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--bg);
    color:var(--muted); font-size:13px; font-weight:600; cursor:pointer;
  }
  .report-group-btn.active{ background:var(--text); color:#fff; border-color:var(--text); }
  .report-period{
    font-size:13px; font-weight:700; color:var(--muted); margin:16px 0 8px;
    padding-top:10px; border-top:1px solid var(--line);
  }
  .report-period:first-child{ margin-top:0; padding-top:0; border-top:none; }
  .report-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:9px 0; border-top:1px solid var(--line); font-size:13px;
  }
  .report-row:first-of-type{ border-top:none; }
  .report-status{
    font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px;
    margin-left:6px; white-space:nowrap;
  }
  .report-status.open{ background:var(--amber-dim); color:var(--amber); }
  .report-status.win{ background:var(--green-dim); color:var(--green); }
  .report-status.loss{ background:rgba(214,69,69,0.1); color:var(--red); }
  .report-empty{ text-align:center; color:var(--muted-2); font-size:13px; padding:30px 0; }
  #reportStatusTabs{ margin-bottom:12px; }
  .report-total{
    display:flex; justify-content:space-between; align-items:center; font-size:13px;
    font-weight:700; padding:10px 12px; background:var(--bg); border-radius:8px; margin-bottom:12px;
  }

  .tabs{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .tab{
    padding:8px 16px; border-radius:999px; border:1px solid var(--line);
    background:var(--panel); font-size:13.5px; font-weight:600; cursor:pointer; color:var(--muted);
  }
  .tab.active{ background:var(--text); color:#fff; border-color:var(--text); }

  .meta{ font-size:12.5px; color:var(--muted); margin-bottom:16px; font-family:var(--mono); }

  .section-label{ font-size:13px; font-weight:700; margin:18px 2px 10px; color:var(--muted); }

  .card{
    border:1px solid var(--line); background:var(--panel); border-radius:12px;
    padding:16px; margin-bottom:10px;
  }
  .card-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .card-name{ font-size:15.5px; font-weight:700; }
  .badge{
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px;
    background:var(--green-dim); color:var(--green);
  }
  .card-line{ font-size:13px; color:var(--muted); margin-top:8px; line-height:1.6; }
  .card-star{ font-size:12.5px; color:var(--amber); margin-top:6px; }

  .empty{ text-align:center; padding:50px 20px; color:var(--muted); font-size:13px; }
  .loading{ text-align:center; padding:50px 20px; color:var(--muted); font-size:13px; }

  .portfolio{
    border:1px solid var(--line); background:var(--panel); border-radius:14px;
    padding:16px 18px; margin-bottom:20px;
  }
  .portfolio-title{ font-size:13px; font-weight:700; color:var(--muted); margin-bottom:12px; }
  .portfolio-stats{ display:flex; gap:22px; flex-wrap:wrap; margin-bottom:4px; }
  .stat-label{ font-size:11.5px; color:var(--muted-2); margin-bottom:2px; }
  .stat-value{ font-size:17px; font-weight:700; font-family:var(--mono); }
  .pos{ color:var(--green); }
  .neg{ color:var(--red); }

  .pos-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:10px 0; border-top:1px solid var(--line);
  }
  .pos-info{ min-width:0; }
  .pos-name{ font-size:14px; font-weight:700; }
  .pos-line{ font-size:12px; color:var(--muted); margin-top:3px; font-family:var(--mono); }
  .basis-note{ font-size:11px; color:var(--muted-2); }
  .pos-pnl{ text-align:right; white-space:nowrap; }
  .pos-pnl-amt{ font-size:14px; font-weight:700; font-family:var(--mono); }
  .pos-pnl-pct{ font-size:11.5px; font-family:var(--mono); }
  .pos-btn-row{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .liquidate-btn{
    display:inline-block; padding:4px 10px; border-radius:999px;
    font-size:11px; font-weight:700; text-decoration:none;
    background:var(--red); color:#fff; opacity:0.85;
  }
  .liquidate-btn:hover{ opacity:1; }
  .portfolio-stats-row{ display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; }
  .liquidate-all-btn{
    display:inline-block; padding:6px 14px; border-radius:999px;
    font-size:12px; font-weight:700; text-decoration:none; white-space:nowrap;
    background:var(--red); color:#fff; opacity:0.9;
  }
  .liquidate-all-btn:hover{ opacity:1; }

  .perf-summary{
    border:1px solid var(--line); background:var(--panel); border-radius:14px;
    padding:16px 18px; margin-bottom:16px;
  }
  .perf-summary-title{ font-size:13px; font-weight:700; color:var(--muted); margin-bottom:12px; }
  .perf-cards{ display:flex; gap:14px; flex-wrap:wrap; }
  .perf-card{
    flex:1; min-width:220px; border:1px solid var(--line); border-radius:10px; padding:12px 14px;
    cursor:pointer; transition:border-color 0.15s, box-shadow 0.15s; background:var(--panel);
  }
  .perf-card:hover{ border-color:var(--muted); }
  .perf-card.active{ border-color:var(--text); box-shadow:0 0 0 1.5px var(--text) inset; }
  .perf-card-title{ font-size:13px; font-weight:700; margin-bottom:3px; }
  .perf-card-note{ display:block; font-size:10.5px; color:var(--muted-2); font-weight:500; margin-bottom:9px; }
  .perf-stats{ display:flex; gap:16px; flex-wrap:wrap; }
  .perf-sub{ font-size:11px; color:var(--muted-2); margin-top:8px; }
  .perf-hint{ font-size:11px; color:var(--muted-2); margin-top:2px; }
  .entries-modal .report-row{ font-size:12.5px; }
  .bt-search{
    width:100%; padding:8px 12px; border-radius:8px; border:1px solid var(--line);
    font-size:13px; font-family:var(--sans); background:var(--bg); color:var(--text);
    margin-bottom:12px; box-sizing:border-box;
  }
  .bt-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:10px 0; border-top:1px solid var(--line); cursor:pointer;
  }
  .bt-row:first-of-type{ border-top:none; }
  .bt-row:hover{ background:var(--bg); }
  .bt-row-name{ font-size:13.5px; font-weight:700; }
  .bt-row-sub{ font-size:11.5px; color:var(--muted); font-family:var(--mono); margin-top:2px; }
  .mini-btn{
    padding:4px 10px; border-radius:999px; border:1px solid var(--line);
    background:var(--panel); color:var(--muted); font-size:11px; font-weight:700; cursor:pointer;
  }
  .mini-btn:hover{ color:var(--text); border-color:var(--muted); }
  .no-positions{ font-size:12.5px; color:var(--muted-2); padding:8px 0 2px; }
  .explain-modal{ max-width:480px; }
  .explain-body{
    font-family:var(--sans); font-size:13.5px; line-height:1.75; color:var(--text);
    white-space:pre-wrap; margin:0; word-break:keep-all;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header-row">
    <div>
      <h1>📋 SST · Signal Sentinels Team</h1>
      <div class="sub">RSI Spread Pro 기반 반등 시그널 자동 스캔 결과</div>
    </div>
    <div class="header-btns">
      <button class="refresh-btn" onclick="openReport()">📊 매수 현황보고서</button>
      <button class="refresh-btn" id="refreshBtn" onclick="refreshAll()">↻ 새로고침</button>
    </div>
  </div>

  <div class="perf-summary" id="perfSummary"></div>

  <div class="portfolio" id="portfolio"></div>

  <div class="portfolio" id="tqqqBacktestPanel"></div>

  <div class="portfolio" id="backtestPanel"></div>

  <div class="modal-backdrop entries-modal" id="entriesBackdrop" style="display:none" onclick="if(event.target===this) closeEntries()">
    <div class="modal">
      <div class="modal-top">
        <div class="modal-title" id="entriesTitle"></div>
        <button class="modal-close" onclick="closeEntries()">✕</button>
      </div>
      <div id="entriesBody"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="btTradesBackdrop" style="display:none" onclick="if(event.target===this) closeBtTrades()">
    <div class="modal">
      <div class="modal-top">
        <div class="modal-title" id="btTradesTitle"></div>
        <button class="modal-close" onclick="closeBtTrades()">✕</button>
      </div>
      <div class="report-total" id="btTradesTotal"></div>
      <div id="btTradesBody"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="explainBackdrop" style="display:none" onclick="if(event.target===this) closeExplain()">
    <div class="modal explain-modal">
      <div class="modal-top">
        <div class="modal-title" id="explainTitle"></div>
        <button class="modal-close" onclick="closeExplain()">✕</button>
      </div>
      <pre class="explain-body" id="explainBody"></pre>
    </div>
  </div>

  <div class="modal-backdrop" id="reportBackdrop" style="display:none" onclick="if(event.target===this) closeReport()">
    <div class="modal">
      <div class="modal-top">
        <div class="modal-title" id="reportModalTitle">📊 매수 현황보고서</div>
        <button class="modal-close" onclick="closeReport()">✕</button>
      </div>
      <div class="tabs" id="reportStatusTabs"></div>
      <div class="report-controls">
        <input class="report-search" id="reportSearch" placeholder="종목명 또는 종목코드 검색 (예: 삼성전자, 005930)"
               oninput="renderReport()" onkeydown="if(event.key==='Enter') renderReport()">
        <button class="report-group-btn" onclick="renderReport()">🔍 검색</button>
        <button class="report-group-btn active" id="groupDayBtn" onclick="setReportGroup('day')">일별</button>
        <button class="report-group-btn" id="groupMonthBtn" onclick="setReportGroup('month')">월별</button>
      </div>
      <div class="report-total" id="reportTotal"></div>
      <div id="reportBody"></div>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="meta" id="meta"></div>
  <div id="content" class="loading">불러오는 중...</div>
</div>

<script>
const TIMEFRAMES = [
  { key: "4h", label: "4시간봉" },
  { key: "1h", label: "1시간봉" },
  { key: "15m", label: "15분봉" },
  { key: "5m", label: "5분봉" },
];

const REPO = "heydey2012/sst-dashboard";
let current = "4h";
const cache = {};

// 새 전략이 추가되면 이 배열에 한 줄만 추가하면 대시보드 상단 카드/상세보기에 자동 반영됨.
// 2026-09-10: 신버전/구버전 실시간 자동매매는 종료 - 98종목 5년 백테스트로 대체 (아래 별도 섹션).
const STRATEGIES = [
  { key: "tqqq", label: "TQQQ 분할매수", positionsFile: "positions_tqqq.json", tradeLogFile: "trade_log_tqqq.json",
    currency: "USD", note: "키움 모의계좌 실주문 · 분할매수(최대 20회) · 평단가 +3% 익절 · -10% 손절" },
];
let currentStrategy = "tqqq";

function strategyInfo(key) {
  return STRATEGIES.find(v => v.key === (key || currentStrategy));
}

function fmtMoney(amount, currency) {
  if (amount === null || amount === undefined || isNaN(amount)) return "-";
  if (currency === "USD") return "$" + amount.toFixed(2);
  return "₩" + Math.round(amount).toLocaleString();
}

async function loadPositions() {
  try {
    const res = await fetch(`results/${strategyInfo().positionsFile}?t=${Date.now()}`);
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;
  }
}

async function loadTradeLog() {
  try {
    const res = await fetch(`results/${strategyInfo().tradeLogFile}?t=${Date.now()}`);
    if (!res.ok) return [];
    return await res.json();
  } catch (e) {
    return [];
  }
}

async function loadTradeLogFile(file) {
  try {
    const res = await fetch(`results/${file}?t=${Date.now()}`);
    if (!res.ok) return [];
    return await res.json();
  } catch (e) {
    return [];
  }
}

function computeStats(trades) {
  const total = trades.length;
  const wins = trades.filter(t => t.pnl > 0);
  const losses = trades.filter(t => t.pnl <= 0);
  const winRate = total ? (wins.length / total * 100) : 0;
  const avgWin = wins.length ? wins.reduce((s, t) => s + t.pnl, 0) / wins.length : 0;
  const avgLoss = losses.length ? losses.reduce((s, t) => s + t.pnl, 0) / losses.length : 0;
  return { total, winCount: wins.length, lossCount: losses.length, winRate, avgWin, avgLoss };
}

function renderPerfCard(strat, stats) {
  const cur = strat.currency;
  return `
    <div class="perf-card${strat.key === currentStrategy ? " active" : ""}" onclick="selectStrategy('${strat.key}')">
      <div class="perf-card-title">${strat.label}</div>
      <div class="perf-card-note">${strat.note}</div>
      <div class="perf-stats">
        <div><div class="stat-label">총 거래</div><div class="stat-value">${stats.total}건</div></div>
        <div><div class="stat-label">승률</div><div class="stat-value">${stats.total ? stats.winRate.toFixed(1) : "-"}%</div></div>
        <div><div class="stat-label">평균 익절</div><div class="stat-value ${stats.winCount ? "pos" : ""}">${stats.winCount ? "+" + fmtMoney(stats.avgWin, cur) : "-"}</div></div>
        <div><div class="stat-label">평균 손절</div><div class="stat-value ${stats.lossCount ? "neg" : ""}">${stats.lossCount ? fmtMoney(stats.avgLoss, cur) : "-"}</div></div>
      </div>
      <div class="perf-sub">승 ${stats.winCount}건 · 패 ${stats.lossCount}건 (청산 완료 거래 기준)</div>
    </div>
  `;
}

function selectStrategy(key) {
  currentStrategy = key;
  renderStrategyCards();
  refreshPortfolio();
}

async function renderStrategyCards() {
  const statsByKey = await Promise.all(
    STRATEGIES.map(s => loadTradeLogFile(s.tradeLogFile).then(computeStats))
  );
  const el = document.getElementById("perfSummary");
  const today = new Date().toLocaleDateString("ko-KR", { year: "numeric", month: "2-digit", day: "2-digit" });
  el.innerHTML = `
    <div class="perf-summary-title">📈 누적 성과 (${today} 기준, 청산 완료 거래 전체) · 카드를 클릭하면 아래에 세부 매매 내역이 표시됩니다</div>
    <div class="perf-cards">
      ${STRATEGIES.map((s, i) => renderPerfCard(s, statsByKey[i])).join("")}
    </div>
  `;
}

let reportGroup = "day";
let reportTrades = null;
let reportStatus = "all";
let lastPositions = [];

function tpslExplainText(p) {
  const bothPivot = p.tp_basis === "피벗고점" && p.sl_basis === "피벗저점";
  const lines = [`매수가: ${p.entry_price.toLocaleString()}원`, ""];
  if (bothPivot) {
    lines.push(`직전 확정 피벗 고점: ${p.pivot_high.toLocaleString()}원 → 익절가로 사용`);
    lines.push(`직전 확정 피벗 저점: ${p.pivot_low.toLocaleString()}원 → 손절가로 사용`);
    lines.push("");
    lines.push("고점과 저점을 잇는 구간의 정중앙(피보나치 0.5 라인)을 기준으로,");
    lines.push("위아래 대칭인 0%(저점)와 100%(고점) 라인을 각각 손절가/익절가로 설정했습니다.");
    lines.push("→ 손익비 정확히 1:1");
  } else {
    lines.push(`익절 기준: ${p.tp_basis || "-"}`);
    lines.push(`손절 기준: ${p.sl_basis || "-"}`);
    lines.push("");
    if (p.sl_basis !== "피벗저점") {
      lines.push("※ 매수 시점에 유효한(매수가보다 낮은) 확정 피벗저점이 없어서,");
      lines.push("   대신 매수가 대비 6% 아래를 손절가로 사용했습니다.");
    }
    if (p.tp_basis !== "피벗고점") {
      lines.push("※ 매수 시점에 유효한(매수가보다 높은) 확정 피벗고점이 없어서,");
      lines.push("   손절폭과 같은 거리(손익비 1:1)를 익절 목표로 사용했습니다.");
    }
  }
  lines.push("");
  lines.push(`최종 익절가: ${p.tp.toLocaleString()}원`);
  lines.push(`최종 손절가: ${p.sl.toLocaleString()}원`);
  return lines.join("\n");
}

function entryExplainText(p) {
  return [
    `매수 시각: ${formatShortDateTime(p.entry_time)}`,
    `매수가: ${p.entry_price.toLocaleString()}원`,
    "",
    "진입 사유:",
    p.best_reason || "(기록 없음)",
    "",
    "※ 15분봉에서 RSI가 자기 자신의 이동평균보다 급격히 낮아지는 시그널(삼각형) 발생 후,",
    "   반등 캔들 패턴(음봉보다 큰 양봉/도지/연속 양봉 등)이 방금 확인되면 매수합니다.",
  ].join("\n");
}

function openExplain(title, text) {
  document.getElementById("explainTitle").textContent = title;
  document.getElementById("explainBody").textContent = text;
  document.getElementById("explainBackdrop").style.display = "flex";
}

function closeExplain() {
  document.getElementById("explainBackdrop").style.display = "none";
}

function showTpslExplain(i) {
  const p = lastPositions[i];
  openExplain(`📐 [${p.ticker}] ${p.name} · 익절/손절 근거`, tpslExplainText(p));
}

function showEntryExplain(i) {
  const p = lastPositions[i];
  openExplain(`🎯 [${p.ticker}] ${p.name} · 진입 근거`, entryExplainText(p));
}

const REPORT_STATUS_TABS = [
  { key: "all", label: "전체" },
  { key: "closed", label: "청산완료" },
  { key: "open", label: "미청산" },
];

function buildReportTrades(positionsData, tradeLog) {
  const trades = [];
  (tradeLog || []).forEach(t => {
    trades.push({
      ticker: t.ticker, name: t.name || t.ticker, qty: t.qty,
      entry_price: t.entry_price ?? t.avg_entry_price, entry_time: t.entry_time ?? t.first_entry_time,
      exit_price: t.exit_price, exit_time: t.exit_time,
      status: t.pnl >= 0 ? "win" : "loss",
      status_label: t.reason || (t.pnl >= 0 ? "익절" : "손절"),
      pnl: t.pnl, pnl_pct: t.pnl_pct,
    });
  });
  ((positionsData && positionsData.positions) || []).forEach(p => {
    trades.push({
      ticker: p.ticker, name: p.name || p.ticker, qty: p.qty,
      entry_price: p.entry_price ?? p.avg_price, entry_time: p.entry_time ?? p.first_entry_time,
      exit_price: null, exit_time: null,
      status: "open", status_label: "보유중",
      pnl: p.pnl, pnl_pct: p.pnl_pct,
    });
  });
  trades.sort((a, b) => new Date(b.entry_time) - new Date(a.entry_time));
  return trades;
}

function periodKey(isoString, group) {
  const d = new Date(isoString);
  if (isNaN(d.getTime())) return "알 수 없음";
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  if (group === "month") return `${yyyy}년 ${mm}월`;
  const dd = String(d.getDate()).padStart(2, "0");
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  return `${yyyy}-${mm}-${dd} (${days[d.getDay()]})`;
}

function setReportGroup(g) {
  reportGroup = g;
  document.getElementById("groupDayBtn").classList.toggle("active", g === "day");
  document.getElementById("groupMonthBtn").classList.toggle("active", g === "month");
  renderReport();
}

function renderReportStatusTabs() {
  const el = document.getElementById("reportStatusTabs");
  el.innerHTML = "";
  REPORT_STATUS_TABS.forEach(s => {
    const btn = document.createElement("div");
    btn.className = "tab" + (s.key === reportStatus ? " active" : "");
    btn.textContent = s.label;
    btn.onclick = () => { reportStatus = s.key; renderReportStatusTabs(); renderReport(); };
    el.appendChild(btn);
  });
}

async function openReport() {
  document.getElementById("reportBackdrop").style.display = "flex";
  document.getElementById("reportModalTitle").textContent = `📊 매수 현황보고서 [${strategyInfo().label}]`;
  document.getElementById("reportBody").innerHTML = `<div class="report-empty">불러오는 중...</div>`;
  reportStatus = "all";
  renderReportStatusTabs();
  const [positionsData, tradeLog] = await Promise.all([loadPositions(), loadTradeLog()]);
  reportTrades = buildReportTrades(positionsData, tradeLog);
  renderReport();
}

function closeReport() {
  document.getElementById("reportBackdrop").style.display = "none";
}

function renderReport() {
  if (!reportTrades) return;
  const body = document.getElementById("reportBody");
  const totalEl = document.getElementById("reportTotal");
  const query = (document.getElementById("reportSearch").value || "").trim().toLowerCase();
  const cur = strategyInfo().currency;

  let filtered = reportTrades;
  if (reportStatus === "open") filtered = filtered.filter(t => t.status === "open");
  else if (reportStatus === "closed") filtered = filtered.filter(t => t.status !== "open");
  if (query) {
    filtered = filtered.filter(t => t.name.toLowerCase().includes(query) || t.ticker.includes(query));
  }

  const statusLabel = REPORT_STATUS_TABS.find(s => s.key === reportStatus).label;
  if (filtered.length === 0) {
    totalEl.innerHTML = "";
    body.innerHTML = `<div class="report-empty">${reportTrades.length === 0 ? "아직 매수 내역이 없습니다." : `${statusLabel} 항목 중 검색/조건에 맞는 내역이 없습니다.`}</div>`;
    return;
  }

  const totalPnl = filtered.reduce((sum, t) => sum + (t.pnl || 0), 0);
  const totalClass = totalPnl >= 0 ? "pos" : "neg";
  totalEl.innerHTML = `<span>${statusLabel} 합계 · ${filtered.length}건</span><span class="${totalClass}">${totalPnl >= 0 ? "+" : ""}${fmtMoney(totalPnl, cur)}</span>`;

  const groups = {};
  const order = [];
  filtered.forEach(t => {
    const key = periodKey(t.entry_time, reportGroup);
    if (!groups[key]) { groups[key] = []; order.push(key); }
    groups[key].push(t);
  });

  let html = "";
  order.forEach(key => {
    const rows = groups[key];
    const periodPnl = rows.reduce((sum, t) => sum + (t.pnl || 0), 0);
    const periodClass = periodPnl >= 0 ? "pos" : "neg";
    html += `<div class="report-period">${key} · ${rows.length}건 · <span class="${periodClass}">${periodPnl >= 0 ? "+" : ""}${fmtMoney(periodPnl, cur)}</span></div>`;
    rows.forEach(t => {
      const hasPnl = t.pnl !== null && t.pnl !== undefined;
      const pnlClass = (t.pnl || 0) >= 0 ? "pos" : "neg";
      const pnlSign = (t.pnl || 0) >= 0 ? "+" : "";
      const timeRange = t.exit_time
        ? `${formatShortDateTime(t.entry_time)} → ${formatShortDateTime(t.exit_time)}`
        : `${formatShortDateTime(t.entry_time)} → 보유중`;
      html += `
        <div class="report-row">
          <div>
            <div><b>[${escapeHtml(t.ticker)}] ${escapeHtml(t.name)}</b><span class="report-status ${t.status}">${escapeHtml(t.status_label)}</span></div>
            <div class="pos-line">${t.qty}주 · ${timeRange}</div>
          </div>
          <div class="pos-pnl">
            <div class="pos-pnl-amt ${hasPnl ? pnlClass : ''}">${hasPnl ? pnlSign + fmtMoney(t.pnl, cur) : '-'}</div>
            <div class="pos-pnl-pct ${hasPnl ? pnlClass : ''}">${hasPnl ? pnlSign + t.pnl_pct + '%' : ''}</div>
          </div>
        </div>
      `;
    });
  });

  body.innerHTML = html;
}

function liquidateUrl(ticker, name) {
  const title = encodeURIComponent(`청산:${ticker}`);
  const body = encodeURIComponent(`대시보드에서 요청한 강제 매도입니다.\n종목: [${ticker}] ${name}\n\n이 이슈를 그대로 "Submit new issue"로 등록하면, 다음 자동 점검 주기(최대 3분 이내)에 시장가로 매도됩니다.`);
  return `https://github.com/${REPO}/issues/new?title=${title}&body=${body}`;
}

function liquidateAllUrl(count) {
  const strat = strategyInfo();
  const vTag = strat.key === "legacy" ? "구버전" : strat.key === "tqqq" ? "TQQQ분할매수" : "신버전";
  const title = encodeURIComponent(`청산전체:${vTag}`);
  const body = encodeURIComponent(`대시보드에서 요청한 전체 강제 매도입니다.\n전략: ${strat.label}\n대상: 보유 중인 ${count}건 전체\n\n이 이슈를 그대로 "Submit new issue"로 등록하면, 다음 자동 점검 주기(최대 3분 이내)에 시장가로 매도됩니다.`);
  return `https://github.com/${REPO}/issues/new?title=${title}&body=${body}`;
}

function tqqqEntriesText(p) {
  const lines = [`총 ${p.split_count}/${p.max_splits}회 분할매수 · 평단가 $${p.avg_price.toFixed(4)}`, ""];
  (p.entries || []).forEach((e, idx) => {

  });
  return lines.join("\n");
}

            <div class="pos-line pos-target"><span class="pos">익절 ${p.tp.toLocaleString()}</span> · <span class="neg">손절 ${p.sl.toLocaleString()}</span></div>
            <div class="pos-line basis-note">${basisNote}</div>
            <div class="pos-btn-row">

async function loadResult(tf) {
  if (cache[tf]) return cache[tf];
  try {
    const res = await fetch(`results/${tf}.json?t=${Date.now()}`);
    if (!res.ok) return null;
    const data = await res.json();
    cache[tf] = data;
    return data;
  } catch (e) {
    return null;
  }
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  TIMEFRAMES.forEach(tf => {
    const el = document.createElement("div");
    el.className = "tab" + (tf.key === current ? " active" : "");
    el.textContent = tf.label;
    el.onclick = () => { current = tf.key; render(); };
    tabs.appendChild(el);
  });
}

function formatShortDateTime(isoString) {
  const d = new Date(isoString);
  if (isNaN(d.getTime())) return isoString;
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  const hh = String(d.getHours()).padStart(2, "0");
  const min = String(d.getMinutes()).padStart(2, "0");
  return `${mm}/${dd} ${hh}:${min}`;
}

function timeAgo(isoString) {
  const diffSec = Math.floor((Date.now() - new Date(isoString).getTime()) / 1000);
  if (diffSec < 5) return "방금";
  if (diffSec < 60) return `${diffSec}초 전`;
  return `${Math.floor(diffSec / 60)}분 전`;
}

function formatDateTime(isoString) {
  const d = new Date(isoString);
  if (isNaN(d.getTime())) return isoString;
  const days = ["일요일","월요일","화요일","수요일","목요일","금요일","토요일"];
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  const dayName = days[d.getDay()];
  let hours = d.getHours();
  const ampm = hours >= 12 ? "PM" : "AM";
  hours = hours % 12;
  if (hours === 0) hours = 12;
  const hh = String(hours).padStart(2, "0");
  const min = String(d.getMinutes()).padStart(2, "0");
  const sec = String(d.getSeconds()).padStart(2, "0");
  return `${yyyy}-${mm}-${dd} ${dayName} ${ampm} ${hh}:${min}:${sec}`;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

function renderCard(v) {
  const reasons = (v.reasons || []).join(", ");
  const entryNote = v.has_active_entry ? " (진입 조건 활성)" : "";
  const bestTag = v.best_signal ? `<span class="badge">강추</span>` : "";
  return `
    <div class="card">
      <div class="card-top">
        <div class="card-name">[${escapeHtml(v.ticker)}] ${escapeHtml(v.name)}${entryNote}</div>
        ${bestTag}
      </div>
      <div class="card-line">시그널 ${escapeHtml(v.signal_time)} @ ${v.signal_price.toLocaleString()}</div>
      <div class="card-line">반등봉 ${escapeHtml(v.rebound_time)} (${v.bars_after_signal}봉 후) @ ${v.rebound_price.toLocaleString()}</div>
      <div class="card-line">패턴: ${escapeHtml(reasons)}</div>
      ${v.best_signal ? `<div class="card-star">⭐ ${escapeHtml(v.best_reason)}</div>` : ""}
    </div>
  `;
}

async function render() {
  renderTabs();
  const content = document.getElementById("content");
  const meta = document.getElementById("meta");
  content.innerHTML = `<div class="loading">불러오는 중...</div>`;
  meta.textContent = "";

  const data = await loadResult(current);
  if (!data) {
    content.innerHTML = `<div class="empty">아직 이 타임프레임의 결과가 없습니다.<br>스캔이 최소 한 번 실행되어야 표시됩니다.</div>`;
    return;
  }

  meta.textContent = `마지막 업데이트: ${formatDateTime(data.last_updated)} · 전체 ${data.total_tickers}종목 · 시그널 ${data.total_signals}건`;

  const results = data.results || [];
  if (results.length === 0) {
    content.innerHTML = `<div class="empty">현재 조건에 맞는 반등 패턴이 없습니다.</div>`;
    return;
  }

  const fresh = results.filter(r => r.is_fresh).sort((a, b) => (b.best_signal ? 1 : 0) - (a.best_signal ? 1 : 0));
  const stale = results.filter(r => !r.is_fresh).sort((a, b) => (b.best_signal ? 1 : 0) - (a.best_signal ? 1 : 0));

  let html = "";
  if (fresh.length > 0) {
    html += `<div class="section-label">🆕 방금 확인됨 (${fresh.length}건)</div>`;
    html += fresh.map(renderCard).join("");
  }
  if (stale.length > 0) {
    html += `<div class="section-label">📚 최근 히스토리 · 참고용 (${stale.length}건)</div>`;
    html += stale.map(renderCard).join("");
  }
  content.innerHTML = html;
}

async function refreshPortfolio() {
  renderPortfolio(await loadPositions());
}

  html += `<div><div class="stat-label">승률</div><div class="stat-value">${s.win_rate_pct}% (${s.n_trades}건)</div></div>`;
  html += `</div>`;
  html += `<div class="pos-row" style="cursor:pointer" onclick="showTqqqBtTrades()"><div class="pos-info"><div class="bt-row-sub">평균 익절 +$${s.avg_win.toLocaleString()} · 평균 손절 $${s.avg_loss.toLocaleString()}${s.open_position ? ` · 현재 분할 ${s.open_position.split_count}/${s.split_count}회 물림 (미실현 $${s.open_position.unrealized_pnl.toLocaleString()})` : ""}</div></div><div class="mini-btn">거래내역 보기 →</div></div>`;
  el.innerHTML = html;
}

async function refreshTqqqBacktest() {
  renderTqqqBacktestPanel(await loadTqqqBacktest());
}

function showTqqqBtTrades() {
  if (!tqqqBtData) return;
  const trades = tqqqBtData.trades || [];
  const s = tqqqBtData.summary;
  document.getElementById("btTradesTitle").textContent = `📈 [TQQQ] 백테스트 거래내역`;

  const totalPnl = trades.reduce((sum, x) => sum + (x.pnl || 0), 0);
  const totalCls = totalPnl >= 0 ? "pos" : "neg";
  document.getElementById("btTradesTotal").innerHTML =
    `<span>청산완료 ${trades.length}건</span><span class="${totalCls}">${totalPnl >= 0 ? "+" : ""}$${totalPnl.toLocaleString()}</span>`;

  let openHtml = "";
  if (s.open_position) {
    const op = s.open_position;
    const opCls = op.unrealized_pnl >= 0 ? "pos" : "neg";

    openHtml = `
      <div class="report-row">
        <div>
          <div><b>현재 미청산(물림) 포지션</b><span class="report-status open">보유중</span></div>
          <div class="pos-line">분할 ${op.split_count}/${s.split_count}회 · ${op.qty}주 · 평단가 $${op.avg_price.toFixed(4)} → 현재 $${op.current_price.toFixed(2)}</div>
        </div>
        <div class="pos-pnl">
          <div class="pos-pnl-amt ${opCls}">${opSign}$${op.unrealized_pnl.toLocaleString()}</div>
        </div>
      </div>
    `;
  }

  const closedHtml = trades.slice().reverse().map(x => {
    const isWin = (x.pnl || 0) >= 0;
    const pnlCls = isWin ? "pos" : "neg";
    const pnlSign = isWin ? "+" : "";
    return `
      <div class="report-row">
        <div>
          <div><b>${formatShortDateTime(x.entry_time)} → ${formatShortDateTime(x.exit_time)}</b><span class="report-status ${isWin ? 'win' : 'loss'}">${escapeHtml(x.exit_reason)} · 분할 ${x.split_count}회</span></div>
          <div class="pos-line">${x.qty}주 · 평단가 $${x.avg_entry_price.toFixed(4)} → 매도 $${x.exit_price.toFixed(4)}</div>
        </div>
        <div class="pos-pnl">

          <div class="pos-pnl-pct ${pnlCls}">${pnlSign}${x.pnl_pct.toFixed(2)}%</div>
        </div>
      </div>
    `;

  document.getElementById("btTradesBody").innerHTML = openHtml + closedHtml;
  document.getElementById("btTradesBackdrop").style.display = "flex";

// ------------------------------------------------------------------
// 98종목 5년 백테스트 (신버전/구버전 실시간 자동매매를 대체)
// ------------------------------------------------------------------
let btTickers = [];
let btQuery = "";

async function loadBacktest() {
  try {
    const res = await fetch(`results/backtest_independent.json?t=${Date.now()}`);
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;
  }
}

function fmtPeriod(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
}

function setBtSearch(v) {
  btQuery = v.trim().toLowerCase();
  renderBtTable();
}

function renderBtTable() {
  const body = document.getElementById("btTableBody");
  if (!body) return;
  let rows = btTickers;
  if (btQuery) {
    rows = rows.filter(t => t.name.toLowerCase().includes(btQuery) || t.ticker.includes(btQuery));
  }
  if (rows.length === 0) {
    body.innerHTML = `<div class="report-empty">검색 조건에 맞는 종목이 없습니다.</div>`;
    return;
  }
  body.innerHTML = rows.map(t => {
    const cls = t.return_pct >= 0 ? "pos" : "neg";
    const sign = t.return_pct >= 0 ? "+" : "";
    return `
      <div class="bt-row" onclick="showBtTrades('${t.ticker}')">
        <div>
          <div class="bt-row-name">[${escapeHtml(t.ticker)}] ${escapeHtml(t.name)}</div>
          <div class="bt-row-sub">거래 ${t.n_trades}건 · 승률 ${t.win_rate_pct}% · 최종 ₩${Math.round(t.final_capital).toLocaleString()}</div>
        </div>
        <div class="pos-pnl">
          <div class="pos-pnl-amt ${cls}">${sign}${t.return_pct}%</div>
        </div>
      </div>
    `;
  }).join("");
}

function renderBacktestPanel(data) {
  const el = document.getElementById("backtestPanel");
  if (!data) {
    el.innerHTML = `<div class="portfolio-title">📊 98종목 백테스트</div><div class="no-positions">아직 백테스트 결과가 없습니다.</div>`;
    return;
  }
  const s = data.summary;
  btTickers = data.tickers || [];
  const cls = s.total_return_pct >= 0 ? "pos" : "neg";
  const sign = s.total_return_pct >= 0 ? "+" : "";

  const tfLabel = (TIMEFRAMES.find(tf => tf.key === s.timeframe) || {}).label || s.timeframe;
  const slText = s.sl_pct ? `평단가-${(s.sl_pct*100).toFixed(0)}% 손절` : "손절없음";
  let html = `<div class="portfolio-title">📊 98종목 RSI Spread Pro 분할매수(DCA) 백테스트 (${tfLabel}, 종목당 ₩${Math.round(s.initial_capital_per_ticker).toLocaleString()} 시드, ${s.split_count}회 분할·평단가+${(s.tp_pct*100).toFixed(0)}% 익절·${slText}) · 데이터 ${fmtPeriod(s.data_from)} ~ ${fmtPeriod(s.data_to)} (더 과거 데이터 백필 진행 중, 갱신될 때마다 결과 자동 반영)</div>`;
  html += `<div class="portfolio-stats">`;
  html += `<div><div class="stat-label">총 초기자금(${s.tickers_used}종목)</div><div class="stat-value">₩${Math.round(s.total_initial_capital).toLocaleString()}</div></div>`;
  html += `<div><div class="stat-label">총 최종자산</div><div class="stat-value">₩${Math.round(s.total_final_capital).toLocaleString()}</div></div>`;
  html += `<div><div class="stat-label">전체 수익률</div><div class="stat-value ${cls}">${sign}${s.total_return_pct}%</div></div>`;
  html += `<div><div class="stat-label">완료거래 승률</div><div class="stat-value">${s.overall_win_rate_pct}% (${s.total_trades}건)</div></div>`;
  html += `<div><div class="stat-label">현재 미청산(물림)</div><div class="stat-value ${s.open_positions_count > 0 ? 'neg' : ''}">${s.open_positions_count}/${s.tickers_used}종목</div></div>`;
  html += `</div>`;
  html += `<input class="bt-search" placeholder="종목명 또는 종목코드 검색 (예: 삼성전자, 005930)" oninput="setBtSearch(this.value)">`;
  html += `<div id="btTableBody"></div>`;
  el.innerHTML = html;
  renderBtTable();
}

async function refreshBacktest() {
  renderBacktestPanel(await loadBacktest());
}

async function showBtTrades(ticker) {
  const t = btTickers.find(x => x.ticker === ticker);
  document.getElementById("btTradesTitle").textContent = `📈 [${ticker}] ${t ? t.name : ""} · 백테스트 거래내역`;
  document.getElementById("btTradesTotal").innerHTML = "";
  document.getElementById("btTradesBody").innerHTML = `<div class="report-empty">불러오는 중...</div>`;
  document.getElementById("btTradesBackdrop").style.display = "flex";

  let trades = [];
  try {
    const res = await fetch(`results/backtest_trades/${ticker}.json?t=${Date.now()}`);
    if (res.ok) trades = await res.json();
  } catch (e) { /* ignore */ }

  const totalPnl = trades.reduce((sum, x) => sum + (x.pnl || 0), 0);
  const totalCls = totalPnl >= 0 ? "pos" : "neg";
  document.getElementById("btTradesTotal").innerHTML =
    `<span>청산완료 ${trades.length}건</span><span class="${totalCls}">${totalPnl >= 0 ? "+" : ""}₩${Math.round(totalPnl).toLocaleString()}</span>`;

  let openHtml = "";
  if (t && t.open_position) {
    const op = t.open_position;
    const opCls = op.unrealized_pnl >= 0 ? "pos" : "neg";
    const opSign = op.unrealized_pnl >= 0 ? "+" : "";
    openHtml = `
      <div class="report-row">
        <div>
          <div><b>현재 미청산(물림) 포지션</b><span class="report-status open">보유중</span></div>
          <div class="pos-line">분할 ${op.split_count}/20회 · ${op.qty}주 · 평단가 ${op.avg_price.toLocaleString()} → 현재 ${op.current_price.toLocaleString()}</div>
        </div>
        <div class="pos-pnl">
          <div class="pos-pnl-amt ${opCls}">${opSign}₩${Math.round(op.unrealized_pnl).toLocaleString()}</div>
        </div>
      </div>
    `;
  }

  if (trades.length === 0 && !openHtml) {
    document.getElementById("btTradesBody").innerHTML = `<div class="report-empty">거래 내역이 없습니다.</div>`;
    return;
  }

  const closedHtml = trades.slice().reverse().map(x => {
    const isWin = (x.pnl || 0) >= 0;
    const pnlCls = isWin ? "pos" : "neg";
    const pnlSign = isWin ? "+" : "";
    const baseLabel = x.exit_reason || "익절(평단가 대비 목표 도달)";
    const statusLabel = `${baseLabel} · 분할 ${x.split_count}회`;
    return `
      <div class="report-row">
        <div>
          <div><b>${formatShortDateTime(x.entry_time)} → ${formatShortDateTime(x.exit_time)}</b><span class="report-status ${isWin ? 'win' : 'loss'}">${escapeHtml(statusLabel)}</span></div>
          <div class="pos-line">${x.qty}주 · 평단가 ${x.avg_entry_price.toLocaleString()} → 매도 ${x.exit_price.toLocaleString()}</div>
        </div>
        <div class="pos-pnl">
          <div class="pos-pnl-amt ${pnlCls}">${pnlSign}₩${Math.round(x.pnl).toLocaleString()}</div>
          <div class="pos-pnl-pct ${pnlCls}">${pnlSign}${x.pnl_pct.toFixed(2)}%</div>
        </div>
      </div>
    `;
  }).join("");

  document.getElementById("btTradesBody").innerHTML = openHtml + closedHtml;
}

function closeBtTrades() {
  document.getElementById("btTradesBackdrop").style.display = "none";
}

async function refreshAll() {
  const btn = document.getElementById("refreshBtn");
  btn.disabled = true;
  btn.classList.add("spinning");
  btn.textContent = "↻ 불러오는 중...";
  cache[current] = null;
  await Promise.all([render(), refreshPortfolio(), renderStrategyCards(), refreshBacktest(), refreshTqqqBacktest()]);
  btn.disabled = false;
  btn.classList.remove("spinning");
  btn.textContent = "↻ 새로고침";
}

render();
renderStrategyCards();
refreshPortfolio();
refreshTqqqBacktest();
refreshBacktest();
setInterval(() => { cache[current] = null; render(); }, 60000); // 1분마다 자동 새로고침
setInterval(refreshPortfolio, 60000);
setInterval(renderStrategyCards, 60000);
</script>
